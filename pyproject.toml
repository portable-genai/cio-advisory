[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cio-advisory"
version = "0.0.1"
description = "B3 CIO Advisory Assistant — grounded, suitability-checked, decision-support talking points for private-bank relationship managers, built ports-and-adapters on the Gemini Enterprise Agent Platform. Decision-support, not financial advice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["wealth", "private-bank", "suitability", "rag", "gemini", "adk", "gcp", "bfsi", "cio-house-view"]

# Core deps are framework-light so the domain + on-prem/test profile install without
# any Google Cloud SDK. The managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repos, so CI
  # installs them with zero credentials. hex-service-kit: outbound S2S, fail-closed net defaults,
  # StrEnum base, to_jsonable, hash-chained WORM audit.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.5",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dateutil>=2.9",
  # Shared jurisdiction PII pattern pack (SG/HK/JP/AU rows + checksum validators + RE2-safe
  # forms + the two-part safety scorer). Pure stdlib, zero deps, public. Pinned by tag: the
  # local redactor, the DLP custom info types and the eval leak check all read ONE source, so
  # a pack fix is a version bump instead of a copy that drifts (retires the C4 regex copy).
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  # review-kit: the producer half of rule R8 (route a requires_human_review escalation to the
  # Hrz7 Human-Review & Maker-Checker Console). Pure stdlib client + transactional outbox, public,
  # pinned by tag; the domain stays pure while the adapter does the S2S submission.
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
]

[project.optional-dependencies]
# The live profile's only extra dependency: Gemini google_search grounded research for
# the real house-view themes (generation runs on a local OpenAI-compatible server and
# needs nothing beyond core httpx).
live = [
  "google-genai>=1.21",
]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.7.1",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-discoveryengine>=0.13",
  "google-cloud-bigquery>=3.25",
  "google-cloud-dlp>=3.20",
  "google-cloud-logging>=3.11",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "a2a-sdk[http-server]>=1.1",
  "mcp>=2.1",
]
# Demo tooling is a PINNED, opt-in extra (F2): the served-page walkthrough and the
# headless-browser anti-rot test need it, while the day-one offline gate (D3) must stay
# installable and green without downloading a browser binary.
demo = [
  "playwright==1.62.0",
]
dev = [
  "pytest>=8.2",
  # Validates the rendered Agent Plugins manifest against the vendored specification
  # schemas. A hard dev dependency, not optional: with it optional the manifest test skips,
  # and a permanently skipped test reports the same green as a passing one.
  "jsonschema>=4.26",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff==0.16.3",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
cio-advisory = "cio_advisory.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cio_advisory"]

[tool.hatch.metadata]
# Allow the pii-kit git+https direct reference in project.dependencies (public repo, pinned
# by tag; the lockfile resolves it to an exact SHA so the no-build-time-coupling property holds).
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long HTML/CSS string literals; line length there
# hurts more than it helps. The shipped package (src) and tests stay strict.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
