name: CI

# Lint + type-check + tests on the LOCAL profile (a WORKING offline stack: SQLite FTS5 +
# deterministic LLM), so CI needs NO Google Cloud credentials and NO google-cloud-*
# packages and still drives the real pipeline end to end. Integration tests are deselected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CIO_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, no GCP SDK)
        # Proves the domain + onprem profile install and run with no google-cloud-* deps.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests eval

      - name: Ruff (format check)
        run: ruff format --check src tests eval

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: Demo anti-rot and portability proofs
        run: |
          PYTHONPATH=src:scripts python scripts/demo_selftest.py
          PYTHONPATH=src python scripts/portability_demo.py

      # F2, the half that had never run. Playwright is pinned in the [demo] extra and compiled
      # into requirements-demo.lock; the browser BINARY is a network download, which is why the
      # offline gate must not depend on it and why it is fetched HERE instead. The demo lock is
      # compiled from the same pyproject.toml as the dev lock installed above, so installing it
      # on top cannot pull a commons backwards.
      - name: Install the pinned headless-browser toolchain
        run: |
          pip install -r requirements-demo.lock
          python -m playwright install --with-deps chromium

      - name: Served demo UI in a real headless Chromium (a SKIP fails this job)
        # tests/browser/test_served_demo_ui.py skips LOUDLY when the extra or the browser is
        # absent, so a fork's day-one offline gate still passes without either. In CI both are
        # installed one step above, so no honest reason to skip is left, and a skip would mean
        # the evidence quietly stopped running -- which is exactly how this suite reported green
        # for as long as it has existed, without ever loading a page. `-rs` prints the reason;
        # the grep is the part that turns it into a failure.
        run: |
          set -o pipefail
          CIO_PROFILE=local python -m pytest tests/browser -q -rs | tee browser-evidence.log
          if grep -qE 'skipped|no tests ran' browser-evidence.log; then
            echo "the served-browser evidence did not run; it proves nothing" >&2
            exit 1
          fi

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the image
      # install. --no-deps: the locks are fully compiled, so audit those exact versions.
      - name: pip-audit (dev + gcp + demo lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
          pip-audit -r requirements-demo.lock --disable-pip --no-deps
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # A plain hard gate, matching pip-audit above: a dependency advisory that only prints
      # is an advisory nobody reads. A dated allowlist rots into theatre: an override that
      # pins a package AT a version flagged by GHSA-fxqj-rqcc-2cmp stops the resolver moving
      # past it, and the finding that actually fails the gate (nanoid GHSA-2v37-7h3g-55p8)
      # would not be on such an allowlist at all. The advisories are fixed in the lockfile.
      - name: npm audit (high severity fails the build)
        working-directory: ui
        run: npm audit --audit-level=high

  ui-build:
    name: Next.js console builds and hydrates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Assert the built console can hydrate
        # A green build proves nothing about hydration. The console's CSP carries a per-request
        # script nonce, and Next can only stamp that onto a DYNAMICALLY rendered route; if the
        # route ever goes back to being statically prerendered, the header still looks perfect
        # while every script tag ships bare, the browser blocks them all, and the console renders
        # as dead markup. This starts the built server and reads the served HTML.
        working-directory: ui
        run: npm run assert-hydratable

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
